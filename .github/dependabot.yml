# Security-only: `open-pull-requests-limit: 0` disables version-update PRs;
# Dependabot security updates (enabled in repo settings) still open PRs for
# advisories affecting the lockfile.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
